name: Android Debug Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Stockfish (optional)
        id: stockfish
        continue-on-error: true
        run: bash scripts/build-stockfish.sh

      - name: Report which engine is bundled
        run: |
          if [ "${{ steps.stockfish.outcome }}" = "success" ]; then
            echo "### Engine: official Stockfish is bundled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Engine: Stockfish build failed, so this APK uses the built-in fallback engine" >> "$GITHUB_STEP_SUMMARY"
            echo "See the 'Build Stockfish' step log and docs/ENGINE_SETUP.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Book-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
